<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Zero City GTA 3D</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050811; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #game { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(12px);
      padding: 14px 18px; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 14px;
      min-width: 280px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .brand { font-weight: 900; letter-spacing: 0.15em; font-size: 1.1rem; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
    .brand span { font-size: 0.7em; color: #ff0055; margin-left: 6px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
    .grid div { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 8px; }
    .grid b { font-size: 1.4rem; color: #fff; }
    .grid small { font-size: 0.65rem; color: rgba(255,255,255,0.6); margin-top: 2px; }

    #touch-layer {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
    }
    .touch-btn {
      position: absolute; pointer-events: auto; background: rgba(0, 240, 255, 0.15);
      border: 2px solid rgba(0, 240, 255, 0.5); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.2rem; color: #00f0ff;
      backdrop-filter: blur(4px); active-bg: rgba(0, 240, 255, 0.4);
    }
    .touch-btn:active { background: rgba(0, 240, 255, 0.4); transform: scale(0.95); }

    #btn-gas { right: 20px; bottom: 100px; width: 75px; height: 75px; background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #00ff88; }
    #btn-brake { right: 105px; bottom: 30px; width: 65px; height: 65px; background: rgba(255, 0, 85, 0.2); border-color: #ff0055; color: #ff0055; }
    #btn-left { left: 20px; bottom: 40px; width: 70px; height: 70px; }
    #btn-right { left: 100px; bottom: 40px; width: 70px; height: 70px; }
    #btn-handbrake { right: 20px; bottom: 30px; width: 70px; height: 60px; border-radius: 14px; background: rgba(255, 200, 0, 0.2); border-color: #ffc800; color: #ffc800; font-size: 0.9rem; }

    #help {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(8px);
      padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.8rem; line-height: 1.6;
    }
    @media (max-width: 768px) { #help { display: none; } }
  </style>
</head>
<body>
  <div id="hud">
    <div class="brand">ZERO CITY <span>GTA 3D</span></div>
    <div class="grid">
      <div><b id="speed">0</b><small>KM/H</small></div>
      <div><b id="gear">N</b><small>GEAR</small></div>
      <div><b id="score">0</b><small>DRIFT</small></div>
    </div>
  </div>

  <div id="help">
    <b>鍵盤操作</b><br>
    W / ↑ 油門　S / ↓ 煞車/倒車<br>
    A D / ← → 轉向　Space 甩尾<br>
    R 重置車輛　C 切換視角
  </div>

  <div id="touch-layer">
    <div id="btn-left" class="touch-btn">◀</div>
    <div id="btn-right" class="touch-btn">▶</div>
    <div id="btn-gas" class="touch-btn">▲</div>
    <div id="btn-brake" class="touch-btn">▼</div>
    <div id="btn-handbrake" class="touch-btn">DRIFT</div>
  </div>

  <canvas id="game"></canvas>

  <script type="module" src="game.js"></script>
</body>
</html>
